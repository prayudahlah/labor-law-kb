name: backend-v2

on:
  push:
    branches: [feat/backend-v2, dev]
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-v2/pom.xml
      - name: Test
        working-directory: backend-v2
        run: mvn -B test
      - name: Build backend image
        run: docker build -f backend-v2/Dockerfile -t labor-law-kb-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t labor-law-kb-frontend:ci frontend
