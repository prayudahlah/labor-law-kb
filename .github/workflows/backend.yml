name: backend

on:
  push:
    branches: [feat/backend-v2, dev]
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test
        working-directory: backend
        run: mvn -B test
      - name: Test jalur inferensi mode SWRL
        working-directory: backend
        env:
          KB_CALC_MODE: swrl
        run: mvn -B test -Dtest=InferControllerTest
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t labor-law-kb-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t labor-law-kb-frontend:ci frontend

  kb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Regenerate ontology dan SWRL
        run: |
          uv run --no-project --with rdflib --with pyyaml python scripts/build_ontology.py
          uv run --no-project --with rdflib --with pyyaml python scripts/build_swrl.py
          uv run --no-project --with rdflib --with pyyaml python scripts/build_catalog.py
      - name: Pastikan berkas generated tidak drift
        run: git diff --exit-code
